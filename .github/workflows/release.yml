name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: mbe
            asset_name: mbe-linux-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Haskell Stack
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.1'
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Stack dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml', 'package.yaml') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Build dependencies
        run: stack build --only-dependencies --test --no-run-tests

      - name: Run tests
        run: stack test

      - name: Build project
        run: stack build --copy-bins --local-bin-path ./bin

      - name: Strip binary
        run: strip ./bin/${{ matrix.artifact_name }}

      - name: Create tarball
        run: |
          mkdir -p release/${{ matrix.asset_name }}
          cp ./bin/${{ matrix.artifact_name }} release/${{ matrix.asset_name }}/
          cp -r static release/${{ matrix.asset_name }}/
          cp -r dist release/${{ matrix.asset_name }}/
          tar czf release/${{ matrix.asset_name }}-${{ github.ref_name }}.tar.gz -C release ${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}-${{ github.ref_name }}
          path: release/${{ matrix.asset_name }}-${{ github.ref_name }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
