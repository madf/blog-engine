# Main blog configuration
[main]

# A place where the static HTML and images will be stored
dest_dir = /var/www/mbe.site
# Number of posts on the front page
num_posts = 10

# Database settings
[database]

# A path to the database file (SQLite)
path = /var/lib/mbe/storage.db

# Image storage settings
[images]

# Preview image height in pixels
preview_height = 300

# JPEG compression quality
jpeg_quality = 100

# Preview image file prefix
preview_prefix = preview-

# Preview scaling algorithm. May be one of: direct, filtered
# 'direct' queries the integral image once per output pixel (faster, more accurate)
# 'filtered' applies a full-resolution box filter then bilinear scaling (legacy)
# scale_method = direct

# Administrative access settings
[admin]

# Admin's login
login = admin

# Admin's password Argon2 hash
password_hash = $argon2id$v=19$m=65536,t=2,p=1$OjYULa8hWb3ztYoAnzfWGA$ujHAUbMCCIYGqA1ytEq4gRgOFoAJ3dVU1lzOIL6f4y8

# JWT configuration
[jwt]

# Path to the static key storage
path = /var/lib/mbe/key.jwk

# Key type. May be one of: hmac, ec, rsa, ecdsa
key_type = ec

# Key material generation parameter. Curve name for 'ec' and 'ecdsa', large integer for 'hmac' and 'rsa'.
key_param = P_384

# Key expiration in seconds.
key_expiration = 3600

# Key issuer name.
key_issuer = MBE

# Logging configuration
[logging]

# Log destination. May be one of: stdout, syslog, file:<path>
destination = file:/var/log/mbe/access.log

# Server configuration
[server]

# Port to listen on
port = 80

# Host/IP address to bind to (0.0.0.0 for all interfaces)
host = 0.0.0.0

# Whether to use detailed request logging or not
debug = no

# Async job manager configuration
[job]

# Finished job cleanup interval, seconds
cleanup_interval = 60

# Maximum time to keep finished job info, seconds
max_ttl = 300

# Maximum number of concurrently running jobs
max_concurrency = 1
