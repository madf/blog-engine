name:                mbe
version:             1.1.3.0
github:              "madf/blog-engine"
license:             BSD-3-Clause
author:              "Maksym Mamontov"
maintainer:          "blog@madf.info"
copyright:           "2025 Maksym Mamontov"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/githubuser/blog#readme>

dependencies:
- base >= 4.7 && < 5

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints
- -Wunused-packages
- -funbox-strict-fields
- -O2

default-extensions:
  ImportQualifiedPost
  OverloadedStrings
  LambdaCase

library:
  source-dirs: src

  dependencies:
    - text
    - aeson
    - bytestring
    - config-ini
    - containers
    - crypton
    - directory
    - fast-logger
    - filepath
    - hashable
    - hsyslog
    - hsexif
    - http-types
    - jose < 0.12
    - lens
    - lucid
    - mtl
    - password
    - resource-pool
    - scotty >= 0.22
    - sqlite-simple
    - time
    - unix
    - unliftio-core
    - unliftio
    - vector
    - wai
    - wai-extra
    - wai-middleware-static
    - warp
    - xxhash-ffi
    - JuicyPixels
    - JuicyPixels-extra

executables:
  mbe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - mbe
    - text

tests:
  mbe-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - mbe
    - hspec
    - hspec-wai
    - scotty
    - resource-pool
